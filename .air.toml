root = "."
tmp_dir = "tmp"

[build]
  # templ generation is part of the build, not a separate watcher: one pipeline
  # means a .templ edit produces exactly one rebuild, and no _templ.go is ever
  # left in templ's watch-mode state (which would dirty the tree).
  cmd = "go tool templ generate && CGO_ENABLED=0 go build -o ./tmp/main ."
  bin = "./tmp/main"
  include_ext = ["go", "templ", "sql"]
  # _templ.go is generated by the build command above, so watching it would
  # trigger a second rebuild for every first one.
  exclude_regex = ["_test\\.go", ".*_templ\\.go"]
  exclude_dir = ["tmp", "bin", "static", "vendor", "testdata"]
  delay = 200
  stop_on_error = false
  log = "build-errors.log"
  send_interrupt = true

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
