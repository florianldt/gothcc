# The dev stack: Postgres plus the app container (Go, templ, sqlc, Tailwind
# and air), which rebuilds on every edit made on the host.
services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gothcc
      POSTGRES_USER: gothcc
      POSTGRES_PASSWORD: gothcc
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gothcc -d gothcc"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: dev/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # compose `environment` beats `env_file`, and a real environment variable
      # beats .env inside the process (godotenv never overrides). So .env stays
      # written for the host workflow while the container reaches the db service.
      DATABASE_URL: postgres://gothcc:gothcc@db:5432/gothcc
      # The migration tests create and drop throwaway databases on this server.
      TEST_DATABASE_URL: postgres://gothcc:gothcc@db:5432/gothcc
      ADDR: 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # Named caches, so a rebuild after `docker compose down` isn't a cold
      # re-download of every module.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
