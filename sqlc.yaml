version: "2"
sql:
  - engine: "postgresql"
    # sqlc understands goose's "-- +goose Up/Down" markers, so the migrations
    # double as the schema source — a single source of truth.
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
